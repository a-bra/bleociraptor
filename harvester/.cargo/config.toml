# ABOUTME: Cross-compilation config for the firmware workspace only. Lives here,
# ABOUTME: never at the repo root — see SPEC.md §6.1 and risk table §21.

[build]
target = "riscv32imac-esp-espidf" # esp32c6 bring-up board; the C3 is riscv32imc (§4.1)

[target.riscv32imac-esp-espidf]
linker = "ldproxy"
# The dual-OTA partition table (§13) is written at flash time; the IDF build
# itself never sees it. Paths are relative to this workspace (harvester/).
runner = "espflash flash --monitor --partition-table partitions.csv"
rustflags = ["--cfg", "espidf_time64"]

[unstable]
build-std = ["std", "panic_abort"]

[env]
MCU = "esp32c6"
ESP_IDF_VERSION = "v5.3.3"
