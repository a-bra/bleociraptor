# ABOUTME: Pure decision crate — no_std, allocation-free, zero ESP dependencies.
# ABOUTME: Everything host-testable lives here; harvester/ is effects only (§6.1).

[package]
name = "harvester-core"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
aes = "0.8"
ccm = { version = "0.5", default-features = false }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.clippy]
indexing_slicing = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
arithmetic_side_effects = "deny"
